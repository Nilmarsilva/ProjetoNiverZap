
services:
  minio:    
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    networks:
      - network_public
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=alex-admin
      - MINIO_ROOT_PASSWORD=WUeiFT1wbmyY0uKNSOfzIMkc8EoRD6rp
      - MINIO_BROWSER_REDIRECT_URL=http://storage.atendimentorapido.app.br	
      - MINIO_SERVER_URL=http://storageapi.atendimentorapido.app.br
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.minio_public.rule=Host(`storageapi.atendimentorapido.app.br`)
        - traefik.http.routers.minio_public.entrypoints=websecure
        - traefik.http.routers.minio_public.tls.certresolver=letsencryptresolver
        - traefik.http.services.minio_public.loadbalancer.server.port=9000
        - traefik.http.services.minio_public.loadbalancer.passHostHeader=true
        - traefik.http.routers.minio_public.service=minio_public
        - traefik.http.routers.minio_console.rule=Host(`storage.atendimentorapido.app.br`)
        - traefik.http.routers.minio_console.entrypoints=websecure
        - traefik.http.routers.minio_console.tls.certresolver=letsencryptresolver
        - traefik.http.services.minio_console.loadbalancer.server.port=9001
        - traefik.http.services.minio_console.loadbalancer.passHostHeader=true
        - traefik.http.routers.minio_console.service=minio_console
volumes:
  minio_data:
    external: true
    name: minio_data

networks:
  network_public:
    external: true
    name: network_public