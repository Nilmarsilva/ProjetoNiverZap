services:  
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: nilmarbiosilva@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Admin55Admin77@
    networks:
     - network_public
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      mode: replicated
      replicas: 1
      placement:
          constraints:
            - node.role == manager
      resources:
          limits:
            cpus: '1'
            memory: 4096M
      labels:
          - traefik.enable=true
          - traefik.http.routers.pgadmin.rule=Host(`pg.authbrasil.app.br`)
          - traefik.http.services.pgadmin.loadbalancer.server.port=80
          - traefik.http.routers.pgadmin.service=pgadmin
          - traefik.http.routers.pgadmin.tls.certresolver=letsencryptresolver
          - traefik.http.routers.pgadmin.entrypoints=websecure
          - traefik.http.routers.pgadmin.tls=true

volumes:
  pgadmin_data:
    external: true
    name: pgadmin_data

networks:
  network_public:
    external: true
    name: network_public