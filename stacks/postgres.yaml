

services:
  postgres:
    # **** >>> Agora usamos esta versão do postgres, está certo! <<< **** 
    ##image: pgvector/pgvector:0.8.0-pg17
    image: astraonline/postgrespgvector:2024
    # **** >>> Agora usamos esta versão do postgres, está certo! <<< ****
    environment:
      - POSTGRES_PASSWORD=1TGY8BaXxUtwk74QLqJz65cf0REpvOVg ### Senha do postgres
      - TZ=America/Sao_Paulo      
      - PG_MAX_CONNECTIONS=500
    networks:
      - network_public 
    ports:
      - 5432:5432   
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager  
          # - node.hostname == worker1       
      resources:
        limits:
          cpus: "1"
          memory: 4096M

volumes:
  postgres_data:
    external: true
    name: postgres_data

networks:
  network_public:
    external: true
    name: network_public ## rede pública