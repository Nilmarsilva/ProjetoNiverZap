version: '3.8'

services:
  test-api:
    image: test-api:latest
    ports:
      - "5001:5001"
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  test-nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../nginx/conf:/etc/nginx/conf.d
    networks:
      - network_public
    depends_on:
      - test-api
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  network_public:
    external: true
