version: '3.8'

services:
  # Serviço da API FastAPI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: niverzap-api:latest
    container_name: niverzap-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PROJECT_NAME=NiverZap API
      - BACKEND_CORS_ORIGINS=["http://localhost:3001","http://frontend:3001","https://seu-dominio.com"]
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Configurações de conexão direta com PostgreSQL
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL=${POSTGRES_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    depends_on:
      - redis
    networks:
      - niverzap-network

  # Serviço do worker do Celery
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: niverzap-worker:latest
    container_name: niverzap-worker
    restart: always
    environment:
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PROJECT_NAME=NiverZap API
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Configurações de conexão direta com PostgreSQL
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL=${POSTGRES_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    depends_on:
      - redis
      - api
    networks:
      - niverzap-network

  # Serviço do beat do Celery
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.beat
    image: niverzap-beat:latest
    container_name: niverzap-beat
    restart: always
    environment:
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PROJECT_NAME=NiverZap API
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Configurações de conexão direta com PostgreSQL
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL=${POSTGRES_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    depends_on:
      - redis
      - api
    networks:
      - niverzap-network

  # Serviço do banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: niverzap-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - niverzap-network

  # Serviço do Redis
  redis:
    image: redis:alpine
    container_name: niverzap-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - niverzap-network

  # Serviço do frontend (React)
  frontend:
    build:
      context: ./zap-niver-dashboard
      dockerfile: Dockerfile
    image: niverzap-frontend:latest
    container_name: niverzap-frontend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - api
    networks:
      - niverzap-network

volumes:
  redis-data:
  postgres-data:

networks:
  niverzap-network:
    driver: bridge
