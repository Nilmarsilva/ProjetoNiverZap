version: '3.8'

services:
  # Serviço de Load Balancer com Nginx
  nginx:
    image: nginx:latest
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    networks:
      - niverzap-network
    depends_on:
      - api

  # Serviço da API Node.js
  api:
    image: niverzap-api:latest
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    # Não expõe a porta diretamente - só através do Nginx
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET}
      - PROJECT_NAME=NiverZap API
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Configurações de conexão com PostgreSQL
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    networks:
      - niverzap-network
    depends_on:
      - postgres
      - redis

  # Serviço do worker do Celery
  worker:
    image: niverzap-worker:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    environment:
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PROJECT_NAME=NiverZap API
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Configurações de conexão direta com PostgreSQL
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL=${POSTGRES_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    networks:
      - niverzap-network

  # Serviço do beat do Celery (apenas uma instância)
  beat:
    image: niverzap-beat:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - PROJECT_NAME=NiverZap API
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Configurações de conexão direta com PostgreSQL
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL=${POSTGRES_SSL}
      # Configurações do Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Configurações das APIs de WhatsApp
      - ZAPI_INSTANCE=${ZAPI_INSTANCE}
      - ZAPI_TOKEN=${ZAPI_TOKEN}
      - WHATSAPP_OFFICIAL_PHONE_ID=${WHATSAPP_OFFICIAL_PHONE_ID}
      - WHATSAPP_OFFICIAL_TOKEN=${WHATSAPP_OFFICIAL_TOKEN}
      - WHATSAPP_OFFICIAL_VERSION=${WHATSAPP_OFFICIAL_VERSION}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    networks:
      - niverzap-network

  # Serviço do PostgreSQL
  postgres:
    image: postgres:14-alpine
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - niverzap-network

  # Serviço do Redis
  redis:
    image: redis:alpine
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - niverzap-network

  # Serviço do frontend (React)
  frontend:
    image: niverzap-frontend:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    ports:
      - "3000:3000"
    networks:
      - niverzap-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  niverzap-network:
    driver: overlay
    attachable: true
