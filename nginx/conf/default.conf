upstream niverzap_backend {
    # Definição do algoritmo de balanceamento (least_conn, ip_hash, etc.)
    least_conn;
    
    # Lista de servidores backend (api)
    # O Docker Swarm resolverá o nome do serviço para todos os contêineres
    server api:5001 max_fails=3 fail_timeout=30s;
    
    # Configuração de keepalive para melhorar o desempenho
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    
    # Configuração de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Configuração de timeout
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 60s;
    
    # Configuração de gzip para compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Redirecionamento para HTTPS (descomentado quando SSL estiver configurado)
    # return 301 https://$host$request_uri;
    
    location / {
        # Configuração de proxy para o frontend
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    location /api {
        # Configuração de proxy para o backend
        proxy_pass http://niverzap_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Configuração de timeout para o backend
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check para monitoramento
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}

